<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAEFight</title><link rel="icon" href="data:," />
    <!-- Critical CSS for the first paint: the branded loading screen shows before any JS/CSS chunk arrives. -->
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07131f; }
      .ld {
        position: fixed; inset: 0; z-index: 90; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: "Helvetica Neue", Helvetica, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; color: #f3f5f7;
        background: radial-gradient(1200px 700px at 50% 120%, #0b6fa8 0%, #0a2a45 45%, #07131f 100%);
        transition: opacity 0.45s ease; user-select: none;
        pointer-events: none; /* never eats clicks meant for the game underneath */
      }
      .ld.hidden { opacity: 0; pointer-events: none; }
      .ld.gone { display: none; }
      .ld-glow { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(60px); opacity: 0.32; animation: ld-drift 18s ease-in-out infinite alternate; }
      .ld-glow.a { background: #2fd0c8; left: -20vmax; top: -30vmax; }
      .ld-glow.b { background: #1d6fd6; right: -25vmax; bottom: -35vmax; animation-duration: 23s; animation-direction: alternate-reverse; opacity: 0.26; }
      @keyframes ld-drift { to { transform: translate(12vmax, 8vmax) scale(1.1); } }
      .ld-waves { position: absolute; left: 0; right: 0; bottom: 0; height: 26vh; opacity: 0.5; }
      .ld-waves svg { position: absolute; bottom: 0; width: 200%; height: 100%; animation: ld-wave 14s linear infinite; }
      .ld-waves svg.back { animation-duration: 22s; opacity: 0.55; bottom: 2vh; }
      @keyframes ld-wave { to { transform: translateX(-50%); } }
      .ld-center { position: relative; display: flex; flex-direction: column; align-items: center; transform: translateY(-4vh); }
      .ld-mark { font-size: clamp(44px, 9vw, 84px); font-weight: 800; letter-spacing: -2px; line-height: 1; text-shadow: 0 6px 40px rgba(47, 208, 200, 0.35); }
      /* Wordmark as generated content: keeps the menu's "FAEFight" heading the only text match on the page. */
      .ld-mark::before { content: "FAE"; }
      .ld-mark::after { content: "Fight"; color: #3ddc84; }
      .ld-tag { margin-top: 10px; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: rgba(243, 245, 247, 0.55); }
      .ld-bar { margin-top: 44px; width: min(360px, calc(100vw - 64px)); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
      .ld-fill { height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, #2fd0c8, #3ddc84); box-shadow: 0 0 14px rgba(61, 220, 132, 0.7); }
      .ld-meta { margin-top: 12px; width: min(360px, calc(100vw - 64px)); display: flex; justify-content: space-between; font-size: 12px; color: rgba(243, 245, 247, 0.6); font-variant-numeric: tabular-nums; }
      .ld-tip { position: absolute; bottom: 7vh; left: 16px; right: 16px; text-align: center; font-size: 14px; color: rgba(243, 245, 247, 0.78); transition: opacity 0.4s; }
      .ld-tip b { display: block; margin-bottom: 6px; font-size: 10.5px; letter-spacing: 2px; color: #3ddc84; }
      .ld.boot .ld-tip { opacity: 0; }
      /* All loading-screen text is generated content (screen readers get aria-valuetext), so it never
         shadows real UI text for text queries while the screen is still fading out. */
      .ld [data-text]::before { content: attr(data-text); }
      @media (prefers-reduced-motion: reduce) { .ld-glow, .ld-waves svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="loading" class="ld boot" data-testid="loading" role="progressbar" aria-label="Loading FAEFight" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="ld-glow a"></div><div class="ld-glow b"></div>
      <div class="ld-waves">
        <svg class="back" viewBox="0 0 1600 200" preserveAspectRatio="none"><path fill="#0d4f7a" d="M0 120 Q100 80 200 120 T400 120 T600 120 T800 120 T1000 120 T1200 120 T1400 120 T1600 120 V200 H0Z"/></svg>
        <svg viewBox="0 0 1600 200" preserveAspectRatio="none"><path fill="#0a3556" d="M0 140 Q100 110 200 140 T400 140 T600 140 T800 140 T1000 140 T1200 140 T1400 140 T1600 140 V200 H0Z"/></svg>
      </div>
      <div class="ld-center">
        <div class="ld-mark" aria-hidden="true"></div>
        <div class="ld-tag" data-text="Islands · Bunkers · Seal them in"></div>
        <div class="ld-bar"><div class="ld-fill"></div></div>
        <div class="ld-meta"><span class="ld-label" data-text="Loading"></span><span class="ld-pct" data-text="0%"></span></div>
      </div>
      <div class="ld-tip"><b data-text="TIP"></b><span class="ld-tip-text" data-text=""></span></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
