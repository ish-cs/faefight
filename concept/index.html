<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>FAEFight concept v1</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .panel { position: absolute; background: linear-gradient(180deg, rgba(10,14,18,.55), rgba(10,14,18,.35)); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; backdrop-filter: blur(4px); }
  #health { left: 28px; bottom: 28px; width: 300px; padding: 10px 14px 12px; }
  #health .lbl { font-size: 11px; letter-spacing: 2px; opacity: .8; display: flex; justify-content: space-between; }
  #health .bar { margin-top: 6px; height: 10px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  #health .fill { width: 82%; height: 100%; background: linear-gradient(90deg, #4fd27a, #8ee59a); }
  #health .armor { margin-top: 4px; height: 5px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  #health .armor div { width: 45%; height: 100%; background: #5fb6ff; }
  #cash { left: 28px; bottom: 104px; padding: 6px 14px; font-size: 26px; font-weight: 700; color: #9ef0a8; }
  #cash small { font-size: 11px; font-weight: 500; letter-spacing: 2px; color: #fff; opacity: .7; margin-left: 8px; }
  #ammo { right: 28px; bottom: 28px; padding: 10px 18px; text-align: right; }
  #ammo .n { font-size: 34px; font-weight: 700; }
  #ammo .n span { font-size: 20px; opacity: .65; font-weight: 500; }
  #ammo .w { font-size: 11px; letter-spacing: 2px; opacity: .75; }
  #timer { left: 50%; top: 18px; transform: translateX(-50%); padding: 6px 16px; font-size: 22px; font-weight: 700; letter-spacing: 1px; text-align: center; }
  #timer small { display: block; font-size: 10px; letter-spacing: 2px; opacity: .7; font-weight: 500; }
  #build { right: 28px; top: 18px; padding: 8px 12px; font-size: 11px; letter-spacing: 1px; line-height: 1.7; opacity: .9; }
  #build b { display: inline-block; min-width: 16px; padding: 0 4px; margin-right: 6px; border: 1px solid rgba(255,255,255,.35); border-radius: 3px; text-align: center; }
  #xhair { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%); }
  #xhair i { position: absolute; background: rgba(255,255,255,.95); box-shadow: 0 0 2px rgba(0,0,0,.8); }
  #xhair .t { left: 12px; top: 0; width: 2px; height: 8px; } #xhair .b { left: 12px; bottom: 0; width: 2px; height: 8px; }
  #xhair .l { top: 12px; left: 0; width: 8px; height: 2px; } #xhair .r { top: 12px; right: 0; width: 8px; height: 2px; }
  #xhair .d { left: 12px; top: 12px; width: 2px; height: 2px; }
  #tag { position: absolute; transform: translate(-50%, -100%); font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #ff6b5b; white-space: nowrap; text-align: center; }
  #tag::after { content: ""; display: block; margin: 2px auto 0; width: 0; height: 0; border: 5px solid transparent; border-top-color: #ff6b5b; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="vig" style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(10,20,30,.38) 100%)"></div>
<div id="hud">
  <div id="timer" class="panel">12:41<small>MATCH</small></div>
  <div id="build" class="panel"><div><b>1</b>Sandbags</div><div><b>2</b>Steel plate</div><div><b>3</b>Scaffold</div><div><b>4</b>Container</div></div>
  <div id="cash" class="panel">$240<small>CARRIED</small></div>
  <div id="health" class="panel"><div class="lbl"><span>HEALTH</span><span>82</span></div><div class="bar"><div class="fill"></div></div><div class="armor"><div></div></div></div>
  <div id="ammo" class="panel"><div class="n">25 <span>/ 75</span></div><div class="w">CARBINE</div></div>
  <div id="xhair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div id="tag">RIVAL</div>
</div>
<script type="module" src="./scene.js"></script>
</body>
</html>
