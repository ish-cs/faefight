name: CI

on:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.v.name }} s${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [2, 3, 4, 5, 6, 7]
        v:
          - { name: restockOff, p: '{"heal.restock.pro":0}' }
          - { name: fight35, p: '{"heal.fightHp.pro":35}' }
          - { name: fight30, p: '{"heal.fightHp.pro":30}' }
          - { name: hardStockFight35, p: '{"heal.stock.pro":1,"heal.stockAt.pro":350,"heal.fightHp.pro":35}' }
          - { name: safe55, p: '{"heal.safeHp.pro":55}' }
          - { name: stockAt350, p: '{"heal.stockAt.pro":350}' }
          - { name: stock1, p: '{"heal.stock.pro":1}' }
          - { name: reload05, p: '{"heal.reloadWeight.pro":0.5}' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: diag
        env:
          DIAG_SEED: ${{ matrix.seed }}
          DIAG_NAME: ${{ matrix.v.name }}
          DIAG_PARAMS: ${{ matrix.v.p }}
        run: pnpm exec vitest run tests/sim/_diagBuildVar.test.ts --silent=false 2>&1 | grep RESULT
