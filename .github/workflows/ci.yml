name: CI

on:
  push:
    # main, plus any branch under ci/ — agents push a ci/<name> branch to get a CI run before a merge.
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run in progress (saves free minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: typecheck, build, unit tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # gameplay props make the bot-match suites ~1.5x longer and runners vary ~2x: a slow runner hit 20 min with
    # every test passing. One job reached the 30 min cap at ~1800 tests (2026-11-28), so vitest runs in 2 shards,
    # 30 min each; tsc + build run in shard 1 only.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        if: matrix.shard == 1
        run: pnpm exec tsc --noEmit
      - name: build
        if: matrix.shard == 1
        run: pnpm exec vite build
      - name: vitest
        run: pnpm test --shard=${{ matrix.shard }}/2

  e2e:
    name: e2e (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Playwright (shard ${{ matrix.shard }}/4)
        run: pnpm exec playwright test --shard ${{ matrix.shard }}/4
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
