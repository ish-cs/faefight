name: CI

on:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.v.name }} s${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [2, 3, 4, 5, 6, 7]
        v:
          - { name: base, p: '{}' }
          - { name: stockLikeHard, p: '{"heal.stock.pro":1,"heal.stockAt.pro":350}' }
          - { name: noDrop, p: '{"heal.slotValue":0}' }
          - { name: noCoverFirst, p: '{"heal.coverFirst.pro":0}' }
          - { name: noStock, p: '{"heal.stock.pro":0,"heal.stockAt.pro":1200}' }
          - { name: noMidFight, p: '{"heal.midFight.pro":0}' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: diag
        env:
          DIAG_SEED: ${{ matrix.seed }}
          DIAG_NAME: ${{ matrix.v.name }}
          DIAG_PARAMS: ${{ matrix.v.p }}
        run: pnpm exec vitest run tests/sim/_diagBuildVar.test.ts --silent=false 2>&1 | grep RESULT
