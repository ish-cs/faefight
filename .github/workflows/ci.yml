name: CI

on:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.v.name }} s${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [8, 9, 10, 11, 12,         v:
          - { name: base, p: '{}' }
          - { name: fight35, p: '{"heal.fightHp.pro":35}' }
          - { name: fight30, p: '{"heal.fightHp.pro":30}' }
ro":0.5}' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: diag
        env:
          DIAG_SEED: ${{ matrix.seed }}
          DIAG_NAME: ${{ matrix.v.name }}
          DIAG_PARAMS: ${{ matrix.v.p }}
        run: pnpm exec vitest run tests/sim/_diagBuildVar.test.ts --silent=false 2>&1 | grep RESULT
