name: CI

on:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  diag:
    name: diag seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: diag
        env:
          DIAG_SEEDS: ${{ matrix.seed }}
        run: pnpm exec vitest run tests/sim/_diagBuild.test.ts
