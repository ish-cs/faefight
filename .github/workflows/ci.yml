name: CI

on:
  push:
    branches: ['ci/**']

permissions:
  contents: read

jobs:
  diag:
    name: ${{ matrix.v.name }} ${{ matrix.mode }} s${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4, 5, 6, 7]
        mode: [build, hit]
        v:
          - { name: f32, p: '{"heal.fightHp.pro":32}' }
          - { name: f33, p: '{"heal.fightHp.pro":33}' }
          - { name: f34, p: '{"heal.fightHp.pro":34}' }
          - { name: f36, p: '{"heal.fightHp.pro":36}' }
          - { name: f37, p: '{"heal.fightHp.pro":37}' }
          - { name: f38, p: '{"heal.fightHp.pro":38}' }
          - { name: f35rel08, p: '{"heal.reloadWeight.pro":0.8}' }
          - { name: f35cov06, p: '{"heal.coverFirst.pro":0.6}' }
        exclude:
          - { mode: build, seed: 1 }
          - { mode: hit, seed: 2 }
          - { mode: hit, seed: 3 }
          - { mode: hit, seed: 4 }
          - { mode: hit, seed: 5 }
          - { mode: hit, seed: 6 }
          - { mode: hit, seed: 7 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: diag
        env:
          DIAG_SEED: ${{ matrix.seed }}
          DIAG_NAME: ${{ matrix.v.name }}
          DIAG_PARAMS: ${{ matrix.v.p }}
          DIAG_MODE: ${{ matrix.mode }}
        run: pnpm exec vitest run tests/sim/_diagBuildVar.test.ts --silent=false 2>&1 | grep -E 'RESULT'
