# TEMPORARY: compares software GL/WebGPU paths for e2e on GPU-less runners. Removed before merge.
name: GL probe
on:
  push:
    branches: ['ci/**']
concurrency:
  group: glprobe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: swiftshader-gl
            args: --use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist
          - name: llvmpipe-egl
            args: --use-angle=gl-egl --use-gl=angle --ignore-gpu-blocklist
          - name: llvmpipe-gl-xvfb
            args: --use-angle=gl --ignore-gpu-blocklist
            xvfb: true
          - name: lavapipe-vulkan-webgpu
            args: --use-angle=vulkan --enable-features=Vulkan --enable-unsafe-webgpu --ignore-gpu-blocklist
          - name: swiftshader-webgpu
            args: --enable-unsafe-webgpu --enable-features=Vulkan --use-webgpu-adapter=swiftshader --enable-unsafe-swiftshader
    name: probe ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: sudo apt-get install -y -q mesa-vulkan-drivers libegl1 libgl1-mesa-dri xvfb >/dev/null
      - name: probe
        env:
          GL_PROBE: '1'
          E2E_CHROME_ARGS: ${{ matrix.args }}
          XVFB: ${{ matrix.xvfb && '1' || '' }}
        run: |
          if [ -n "$XVFB" ]; then xvfb-run -a pnpm exec playwright test tests/e2e/zzglprobe.spec.ts --retries=0; else pnpm exec playwright test tests/e2e/zzglprobe.spec.ts --retries=0; fi
